<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Clip Shoutout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Roboto', sans-serif;
        }

        .clip-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            transition: opacity 350ms ease, visibility 350ms ease;
            background: rgba(0, 0, 0, 0.85);
        }

        .clip-overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .clip-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1280px;
            max-height: 720px;
            margin: auto;
        }

        .clip-player {
            flex: 1 1 auto;
            min-height: 0;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }

        .clip-player iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .clip-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 0 0 12px 12px;
            border-top: 2px solid #9147ff;
        }

        .clip-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #9147ff 0%, #6441a5 100%);
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            line-height: 1.2;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            user-select: none;
            max-width: min(92vw, 1100px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 20px rgba(145, 71, 255, 0.4);
        }

        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.95);
            color: #0f0;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-width: 600px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            border: 2px solid #0f0;
            display: block;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="overlay" class="clip-overlay">
        <div class="clip-shell">
            <div class="clip-player" id="player"></div>
            <div class="clip-footer">
                <a id="badge" class="clip-badge" href="#" target="_blank">Waiting for clip...</a>
            </div>
        </div>
    </div>
    <div id="debug">Loading...</div>

    <script>
        // ========== CONFIGURATION ==========
        const CHANNEL = 'iconyx_';  // ← CHANGE THIS TO YOUR TWITCH USERNAME
        const MODS_CAN_TRIGGER = true;
        const ALWAYS_TOP_CLIP = false;
        const CLIP_DURATION = 30;
        // ====================================

        const debugEl = document.getElementById('debug');
        const overlayEl = document.getElementById('overlay');
        const playerEl = document.getElementById('player');
        const badgeEl = document.getElementById('badge');

        let unmountTimer = null;
        let endTimer = null;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const line = `[${time}] ${msg}`;
            console.log(line);
            debugEl.innerHTML += line + '<br>';
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        function fadeIn() {
            if (unmountTimer) clearTimeout(unmountTimer);
            overlayEl.classList.add('visible');
        }

        function fadeOut() {
            overlayEl.classList.remove('visible');
            unmountTimer = setTimeout(() => {
                playerEl.innerHTML = '';
            }, 350);
        }

        function playClip(clipSlug, channelName, title) {
            log(`▶️ Playing: ${title || clipSlug}`);
            
            const embedUrl = `https://clips.twitch.tv/embed?clip=${clipSlug}&parent=${window.location.hostname}&autoplay=true&muted=false`;
            
            playerEl.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;
            
            badgeEl.href = `https://twitch.tv/${channelName}`;
            badgeEl.textContent = `${channelName} — ${title || 'Clip'}`;
            
            fadeIn();
            
            if (endTimer) clearTimeout(endTimer);
            endTimer = setTimeout(() => {
                fadeOut();
                log('⏹️ Clip ended');
            }, CLIP_DURATION * 1000 + 1000);
        }

        async function fetchClips(username) {
            log(`🔍 Fetching clips for ${username}...`);
            
            try {
                const response = await fetch(`https://decapi.me/twitch/clips/${username}?limit=20`);
                const text = await response.text();
                
                log(`📡 API Response: ${text.substring(0, 50)}...`);
                
                if (!text || text.includes('error') || text === 'No clips found') {
                    throw new Error('No clips found');
                }
                
                const slugs = text.split(',').map(s => s.trim()).filter(Boolean);
                log(`✅ Found ${slugs.length} clips`);
                return slugs;
                
            } catch (err) {
                log(`❌ Fetch error: ${err.message}`);
                return [];
            }
        }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Initialize
        log('═══════════════════════════════');
        log('🚀 Widget Starting...');
        log(`📺 Channel: ${CHANNEL}`);
        log(`🔧 Mods can trigger: ${MODS_CAN_TRIGGER}`);
        log('═══════════════════════════════');

        // Load TMI.js dynamically
        log('📦 Loading TMI.js library...');
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js';
        script.onload = function() {
            log('✅ TMI.js loaded successfully');
            initializeTMI();
        };
        script.onerror = function() {
            log('❌ FAILED to load TMI.js!');
            log('⚠️ Check your internet connection');
        };
        document.head.appendChild(script);

        function initializeTMI() {
            try {
                log('🔌 Connecting to Twitch IRC...');
                
                const client = new tmi.Client({
                    connection: {
                        secure: true,
                        reconnect: true
                    },
                    channels: [CHANNEL.toLowerCase()]
                });

                client.on('connecting', () => {
                    log('⏳ Connecting...');
                });

                client.on('connected', (address, port) => {
                    log(`✅ Connected to ${address}:${port}`);
                    log(`✅ Joined #${CHANNEL}`);
                    log('🎉 READY! Use !soclip <username> in chat');
                });

                client.on('disconnected', (reason) => {
                    log(`❌ Disconnected: ${reason}`);
                });

                client.on('message', async (channel, tags, message, self) => {
                    if (self) return;
                    
                    log(`💬 ${tags.username}: ${message}`);
                    
                    const parts = message.trim().split(/\s+/);
                    if (parts[0].toLowerCase() !== '!soclip') return;
                    
                    log('🎬 !soclip command detected!');
                    
                    const username = (tags.username || '').toLowerCase();
                    const isBroadcaster = tags.badges?.broadcaster === '1' || username === CHANNEL.toLowerCase();
                    const isMod = tags.mod === true || tags.badges?.moderator === '1';
                    const canTrigger = isBroadcaster || (MODS_CAN_TRIGGER && isMod);
                    
                    log(`👤 User: ${username} | Broadcaster: ${isBroadcaster} | Mod: ${isMod}`);
                    
                    if (!canTrigger) {
                        log('⛔ Permission denied');
                        return;
                    }
                    
                    const targetUser = parts[1];
                    if (!targetUser) {
                        log('⚠️ No username provided');
                        return;
                    }
                    
                    log(`🎯 Target: ${targetUser}`);
                    
                    const clips = await fetchClips(targetUser);
                    
                    if (clips.length === 0) {
                        log('❌ No clips available');
                        return;
                    }
                    
                    const chosen = ALWAYS_TOP_CLIP ? clips[0] : pickRandom(clips);
                    playClip(chosen, targetUser, 'Clip');
                });

                client.connect().catch(err => {
                    log(`❌ Connection error: ${err.message}`);
                });
                
            } catch (err) {
                log(`❌ FATAL ERROR: ${err.message}`);
                log(`Stack: ${err.stack}`);
            }
        }
    </script>
</body>
</html>
