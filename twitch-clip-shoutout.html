<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Clip Shoutout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Roboto', sans-serif;
        }

        .clip-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            transition: opacity 350ms ease, visibility 350ms ease;
            background: rgba(0, 0, 0, 0.85);
        }

        .clip-overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .clip-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1280px;
            max-height: 720px;
            margin: auto;
        }

        .clip-player {
            flex: 1 1 auto;
            min-height: 0;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }

        .clip-player iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .clip-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 0 0 12px 12px;
            border-top: 2px solid #9147ff;
        }

        .clip-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #9147ff 0%, #6441a5 100%);
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            line-height: 1.2;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            user-select: none;
            max-width: min(92vw, 1100px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 20px rgba(145, 71, 255, 0.4);
        }

        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.95);
            color: #0f0;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-width: 600px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            border: 2px solid #0f0;
            display: block;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="overlay" class="clip-overlay">
        <div class="clip-shell">
            <div class="clip-player" id="player"></div>
            <div class="clip-footer">
                <a id="badge" class="clip-badge" href="#" target="_blank">Waiting for clip...</a>
            </div>
        </div>
    </div>
    <div id="debug">Initializing...</div>

    <script>
        // ========== CONFIGURATION ==========
        const CHANNEL = 'iconyx_';  // ← CHANGE THIS TO YOUR TWITCH USERNAME
        const MODS_CAN_TRIGGER = true;
        const ALWAYS_TOP_CLIP = false;
        const CLIP_DURATION = 30;
        // ====================================

        const debugEl = document.getElementById('debug');
        const overlayEl = document.getElementById('overlay');
        const playerEl = document.getElementById('player');
        const badgeEl = document.getElementById('badge');

        let ws = null;
        let unmountTimer = null;
        let endTimer = null;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const line = `[${time}] ${msg}`;
            console.log(line);
            debugEl.innerHTML += line + '<br>';
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        function fadeIn() {
            if (unmountTimer) clearTimeout(unmountTimer);
            overlayEl.classList.add('visible');
        }

        function fadeOut() {
            overlayEl.classList.remove('visible');
            unmountTimer = setTimeout(() => {
                playerEl.innerHTML = '';
            }, 350);
        }

        function playClip(clipSlug, channelName, title) {
            log(`▶️ Playing: ${title || clipSlug}`);
            
            const embedUrl = `https://clips.twitch.tv/embed?clip=${clipSlug}&parent=${window.location.hostname}&autoplay=true&muted=false`;
            
            playerEl.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;
            
            badgeEl.href = `https://twitch.tv/${channelName}`;
            badgeEl.textContent = `${channelName} — ${title || 'Clip'}`;
            
            fadeIn();
            
            if (endTimer) clearTimeout(endTimer);
            endTimer = setTimeout(() => {
                fadeOut();
                log('⏹️ Clip ended');
            }, CLIP_DURATION * 1000 + 1000);
        }

        async function fetchClipsFromDecAPI(username) {
            log(`🔍 [DecAPI] Trying for ${username}...`);
            try {
                const response = await fetch(`https://decapi.me/twitch/clips/${username}?limit=20`);
                const text = await response.text();
                
                if (!response.ok || text.includes('404') || text.includes('error') || text === 'No clips found') {
                    throw new Error('DecAPI failed');
                }
                
                const slugs = text.split(',').map(s => s.trim()).filter(Boolean);
                if (slugs.length > 0) {
                    log(`✅ [DecAPI] Found ${slugs.length} clips`);
                    return slugs;
                }
                throw new Error('No clips');
            } catch (err) {
                log(`❌ [DecAPI] Failed: ${err.message}`);
                return null;
            }
        }

        async function fetchClipsFromIVR(username) {
            log(`🔍 [IVR] Trying for ${username}...`);
            try {
                const response = await fetch(`https://api.ivr.fi/v2/twitch/user/${username}/clips`);
                if (!response.ok) throw new Error('IVR API error');
                
                const data = await response.json();
                if (data && data.clips && data.clips.length > 0) {
                    const slugs = data.clips.map(c => c.slug).filter(Boolean);
                    log(`✅ [IVR] Found ${slugs.length} clips`);
                    return slugs;
                }
                throw new Error('No clips');
            } catch (err) {
                log(`❌ [IVR] Failed: ${err.message}`);
                return null;
            }
        }

        async function fetchClipsFromTwitchTracker(username) {
            log(`🔍 [TwitchTracker] Trying for ${username}...`);
            try {
                // This is a workaround - gets recent popular clips
                const response = await fetch(`https://twitchtracker.com/${username}/clips`);
                const html = await response.text();
                
                // Parse clip slugs from HTML
                const regex = /clips\.twitch\.tv\/([A-Za-z0-9_-]+)/g;
                const matches = [...html.matchAll(regex)];
                const slugs = [...new Set(matches.map(m => m[1]))].slice(0, 20);
                
                if (slugs.length > 0) {
                    log(`✅ [TwitchTracker] Found ${slugs.length} clips`);
                    return slugs;
                }
                throw new Error('No clips');
            } catch (err) {
                log(`❌ [TwitchTracker] Failed: ${err.message}`);
                return null;
            }
        }

        async function fetchClips(username) {
            log(`🔍 Starting clip search for ${username}...`);
            
            // Try APIs in order until one works
            const apis = [
                fetchClipsFromIVR,
                fetchClipsFromDecAPI,
                fetchClipsFromTwitchTracker
            ];
            
            for (const api of apis) {
                const clips = await api(username);
                if (clips && clips.length > 0) {
                    return clips;
                }
            }
            
            log(`❌ All APIs failed - no clips found for ${username}`);
            return [];
        }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function parseTwitchMessage(rawMessage) {
            const parsed = {
                raw: rawMessage,
                tags: {},
                prefix: null,
                command: null,
                params: []
            };

            let position = 0;

            // Parse tags
            if (rawMessage[0] === '@') {
                const nextSpace = rawMessage.indexOf(' ');
                const tagsRaw = rawMessage.slice(1, nextSpace);
                tagsRaw.split(';').forEach(tag => {
                    const [key, value] = tag.split('=');
                    parsed.tags[key] = value;
                });
                position = nextSpace + 1;
            }

            // Parse prefix
            if (rawMessage[position] === ':') {
                const nextSpace = rawMessage.indexOf(' ', position);
                parsed.prefix = rawMessage.slice(position + 1, nextSpace);
                position = nextSpace + 1;
            }

            // Parse command
            const nextSpace = rawMessage.indexOf(' ', position);
            if (nextSpace === -1) {
                parsed.command = rawMessage.slice(position);
                return parsed;
            }

            parsed.command = rawMessage.slice(position, nextSpace);
            position = nextSpace + 1;

            // Parse params
            if (rawMessage[position] === ':') {
                parsed.params.push(rawMessage.slice(position + 1));
            } else {
                const parts = rawMessage.slice(position).split(' :');
                const params = parts[0].split(' ');
                parsed.params.push(...params);
                if (parts.length > 1) {
                    parsed.params.push(parts.slice(1).join(' :'));
                }
            }

            return parsed;
        }

        function connectToTwitch() {
            log('═══════════════════════════════');
            log('🚀 Widget Starting...');
            log(`📺 Channel: ${CHANNEL}`);
            log(`🔧 Mods can trigger: ${MODS_CAN_TRIGGER}`);
            log('═══════════════════════════════');
            log('🔌 Connecting to Twitch IRC via WebSocket...');

            ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                log('✅ WebSocket connected!');
                log('📤 Sending authentication...');
                
                // Anonymous login (no oauth needed for read-only)
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                ws.send('PASS SCHMOOPIIE');
                ws.send(`NICK justinfan${Math.floor(Math.random() * 99999)}`);
                ws.send(`JOIN #${CHANNEL.toLowerCase()}`);
                
                log(`✅ Joined #${CHANNEL}`);
                log('🎉 READY! Use !soclip <username> in chat');
            };

            ws.onmessage = (event) => {
                const lines = event.data.split('\r\n');
                
                lines.forEach(line => {
                    if (!line) return;
                    
                    // Respond to PING
                    if (line.startsWith('PING')) {
                        ws.send('PONG :tmi.twitch.tv');
                        return;
                    }

                    // Parse message
                    const parsed = parseTwitchMessage(line);
                    
                    if (parsed.command === 'PRIVMSG') {
                        const username = parsed.tags['display-name'] || parsed.prefix.split('!')[0];
                        const message = parsed.params[parsed.params.length - 1];
                        
                        log(`💬 ${username}: ${message}`);
                        
                        const parts = message.trim().split(/\s+/);
                        if (parts[0].toLowerCase() !== '!soclip') return;
                        
                        log('🎬 !soclip command detected!');
                        
                        const badges = parsed.tags['badges'] || '';
                        const isBroadcaster = badges.includes('broadcaster');
                        const isMod = badges.includes('moderator') || parsed.tags['mod'] === '1';
                        const canTrigger = isBroadcaster || (MODS_CAN_TRIGGER && isMod);
                        
                        log(`👤 User: ${username} | Broadcaster: ${isBroadcaster} | Mod: ${isMod}`);
                        
                        if (!canTrigger) {
                            log('⛔ Permission denied');
                            return;
                        }
                        
                        const targetUser = parts[1];
                        if (!targetUser) {
                            log('⚠️ No username provided');
                            return;
                        }
                        
                        log(`🎯 Target: ${targetUser}`);
                        
                        fetchClips(targetUser).then(clips => {
                            if (clips.length === 0) {
                                log('❌ No clips available');
                                return;
                            }
                            
                            const chosen = ALWAYS_TOP_CLIP ? clips[0] : pickRandom(clips);
                            playClip(chosen, targetUser, 'Clip');
                        });
                    }
                });
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error}`);
            };

            ws.onclose = () => {
                log('❌ Disconnected from Twitch');
                log('⟳ Reconnecting in 5 seconds...');
                setTimeout(connectToTwitch, 5000);
            };
        }

        // Start connection
        connectToTwitch();
    </script>
</body>
</html>
